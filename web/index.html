<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5efe3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d1914" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f1a14'/%3E%3Cpath d='M9 10h14M9 16h14M9 22h9' stroke='%23ca8a04' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>wealth</title>
    <!-- Same as Mantine's <ColorSchemeScript defaultColorScheme="auto" />: set the scheme before first paint so dark mode doesn't flash.
         Also applies the saved UI language to <html lang> early. -->
    <script>
      try {
        var s = localStorage.getItem("mantine-color-scheme-value");
        if (s !== "light" && s !== "dark") s = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-mantine-color-scheme", s);
        var l = localStorage.getItem("lang") || (navigator.language.indexOf("zh") === 0 ? "zh" : "en");
        document.documentElement.lang = l === "en" ? "en" : "zh-Hant";
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://font.emtech.cc" crossorigin />
    <!-- fonts are non-blocking: text paints in the fallback first, then swaps -->
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,400&display=swap" />
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://font.emtech.cc/css/GenRyuMinTW/600" />
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://font.emtech.cc/css/MiSansTC/400" />
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://font.emtech.cc/css/MiSansTC/500" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
