# docker compose up -d --build   →  http://127.0.0.1:8080 (user: WEALTH_USER, default "me"; password: WEALTH_PASS)
# --build builds this checkout. Without it, compose pulls the image release.yml publishes on every v* tag; that
# image exists from the first release (v2.0.0) on, and until then the pull fails over to the build: below.
# Data (wealth.db and the daily backups/) lives in the "wealth-data" volume.
services:
  wealth:
    image: ghcr.io/sammylin/wealth:latest
    build: . # the fallback: used by --build, or when the image can't be pulled
    restart: unless-stopped
    ports:
      # Local only. To reach it from other devices, put a TLS proxy in front (README "Behind a reverse proxy"):
      # removing 127.0.0.1 would send the Basic Auth password over plain HTTP.
      - "127.0.0.1:8080:8080"
    environment:
      WEALTH_PASS: ${WEALTH_PASS:?Set WEALTH_PASS in .env (copy .env.example)}
      WEALTH_USER: ${WEALTH_USER:-me}
    volumes:
      - wealth-data:/data

volumes:
  wealth-data:
