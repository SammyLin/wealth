name: release

# Push a tag like v2.0.0: test.yml runs first, then binaries for linux/darwin × amd64/arm64 go on a GitHub
# release and the ghcr.io/sammylin/wealth image (2.0.0, 2.0 and latest) is pushed for compose.yaml. A tag with
# a "-" (v2.0.0-rc1) is a pre-release: releases/latest/download/... and the image's latest tag skip it.
# Only GITHUB_TOKEN is needed.
#
# Run it by hand (Actions → release → Run workflow) to prove the pipeline without publishing: everything is
# built, nothing is released or pushed.
#
# After the very first release: GHCR creates the package private. Make it public once (GitHub → Packages →
# wealth → Package settings → Change visibility), or `docker compose up` can't pull it without a login.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # the release and its files
  packages: write # ghcr.io

env:
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  test:
    uses: ./.github/workflows/test.yml

  binaries:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # the UI is embedded into the binary, so it is built first
      - run: cd web && npm ci && npm run build
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: build
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*} arch=${target#*/}
            name=wealth-${os}-${arch} # no version in the name, so releases/latest/download/<name>.tar.gz always works
            # modernc.org/sqlite is pure Go, so every target cross-compiles without cgo
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "dist/$name/wealth" ./cmd/wealth
            cp LICENSE README.md "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          done
          cd dist && sha256sum ./*.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: release
        if: env.PUBLISH == 'true'
        run: |
          pre=""; [[ "$GITHUB_REF_NAME" == *-* ]] && pre="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --verify-tag --generate-notes $pre
        env:
          GH_TOKEN: ${{ github.token }}

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3 # only the runtime stage runs emulated; Node and Go build natively
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sammylin/wealth # lower case: registry names can't have capitals
          # semver patterns skip {{major}}.{{minor}} and latest for a pre-release tag
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,enable=${{ env.PUBLISH != 'true' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
