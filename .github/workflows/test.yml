name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm run lint && npm run build
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      # the Workers build must keep compiling too
      - run: GOOS=js GOARCH=wasm go vet ./...
      - run: GOOS=js GOARCH=wasm go build -tags nomsgpack -o /dev/null ./cmd/wealth
